name: Apply complete history update

on:
  push:
    paths:
      - ".history-patch/**"
      - ".github/workflows/apply-history.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-history-update
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruct and apply patch
        shell: bash
        run: |
          set -euo pipefail
          cat .history-patch/part01 \
              .history-patch/part02 \
              .history-patch/part03_04 \
              .history-patch/part05_07 \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/beatline-history.patch
          git apply --check /tmp/beatline-history.patch
          git apply /tmp/beatline-history.patch

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies and refresh lockfile
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build production site
        run: npm run build

      - name: Commit verified history update
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .history-patch
          rm -f .github/workflows/apply-history.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add complete 500-event history database"
          git push origin HEAD:main
